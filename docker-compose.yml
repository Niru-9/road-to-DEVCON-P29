name: qf-round

services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    image: qf-round-backend:local
    restart: unless-stopped
    env_file:
      - path: ./backend/.env
        required: false
    environment:
      NODE_ENV: production
      HOST: 0.0.0.0
      PORT: "3001"
      DATABASE_PATH: /app/data/qf.db
    ports:
      - "${BACKEND_PORT:-3001}:3001"
    volumes:
      - qf-data:/app/data
      - ./fixtures:/app/fixtures:ro
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:3001/health"]
      interval: 30s
      timeout: 5s
      start_period: 20s
      retries: 3

volumes:
  qf-data:
    name: qf-round-data
